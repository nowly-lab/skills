name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: ./scripts/check-public.sh
      - run: python3 scripts/test_release_policy.py
      - run: python3 -m unittest discover -p 'test_*.py'
        working-directory: skills/openscreen-demo/scripts
      - run: node --test scripts/*.test.mjs && node scripts/verify-skill-assets.mjs
        working-directory: skills/react-component-quality
